global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "caddy"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["caddy:2019"]
  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']    